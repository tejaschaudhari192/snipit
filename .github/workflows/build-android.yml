name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/setup@v1
        with:
          version: 11

      - name: Install mobile dependencies
        working-directory: mobile
        run: pnpm install --no-frozen-lockfile --config.confirmModulesPurge=false --config.node-linker=hoisted

      - name: Expo Prebuild (Generate Android native project)
        working-directory: mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Make Gradle Wrapper Executable
        working-directory: mobile/android
        run: chmod +x ./gradlew

      - name: Configure Release Signing (Use debug keystore for preview APK)
        working-directory: mobile/android
        run: |
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' app/build.gradle || true
          sed -i 's/signingConfigs {/signingConfigs { release { storeFile file("debug.keystore")\n storePassword "android"\n keyAlias "androiddebugkey"\n keyPassword "android" }/g' app/build.gradle || true

      - name: Build Android Release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Snipit-Android-APK
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 14
