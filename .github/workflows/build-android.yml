name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          version: '11'

      - name: Install mobile dependencies
        working-directory: mobile
        run: pnpm install --no-frozen-lockfile --config.confirmModulesPurge=false --config.node-linker=hoisted

      - name: Expo Prebuild (Generate Android native project)
        working-directory: mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: mobile/android

      - name: Make Gradle Wrapper Executable
        working-directory: mobile/android
        run: chmod +x ./gradlew

      - name: Configure Release Signing (Use debug keystore for preview APK)
        working-directory: mobile/android
        run: |
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' app/build.gradle || true
          sed -i 's/signingConfigs {/signingConfigs { release { storeFile file("debug.keystore")\n storePassword "android"\n keyAlias "androiddebugkey"\n keyPassword "android" }/g' app/build.gradle || true

      - name: Build Android Release APK (arm64-v8a for modern phones)
        working-directory: mobile/android
        run: |
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            --parallel \
            --build-cache \
            --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Extract App Version
        id: app_version
        run: |
          VERSION=$(node -p "require('./mobile/app.json').expo.version")
          BUILD=$(node -p "require('./mobile/app.json').expo.android.versionCode")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build=${BUILD}" >> $GITHUB_OUTPUT

      - name: Prepare APKs for Release (Standard Versioned + Canonical Link)
        run: |
          VERSION="${{ steps.app_version.outputs.version }}"
          mkdir -p release-apks
          ORIGINAL_APK=$(ls mobile/android/app/build/outputs/apk/release/*.apk | head -n 1)
          # Standard open-source naming: AppName-v[version]-release.apk
          cp "$ORIGINAL_APK" "release-apks/Snipit-v${VERSION}-release.apk"
          # Canonical permanent download file
          cp "$ORIGINAL_APK" "release-apks/snipit.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Snipit-Android-APK
          path: release-apks/*.apk
          retention-days: 14

      - name: Publish Direct Download APK Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: mobile-latest
          name: Snipit Mobile v${{ steps.app_version.outputs.version }} (Build ${{ steps.app_version.outputs.build }})
          body: |
            ### 📱 Snipit Mobile v${{ steps.app_version.outputs.version }} (Build ${{ steps.app_version.outputs.build }})

            - **Versioned APK**: [Snipit-v${{ steps.app_version.outputs.version }}-release.apk](https://github.com/${{ github.repository }}/releases/download/mobile-latest/Snipit-v${{ steps.app_version.outputs.version }}-release.apk)
            - **Permanent Direct APK**: [snipit.apk](https://github.com/${{ github.repository }}/releases/download/mobile-latest/snipit.apk)
          files: release-apks/*.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
